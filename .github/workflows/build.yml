name: Build IPA

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          xcodebuild -project ScooterBridge.xcodeproj -scheme ScooterBridge \
            -sdk iphoneos -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package IPA
        run: |
          rm -rf Payload ScooterBridge.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ScooterBridge.app Payload/
          zip -qry ScooterBridge.ipa Payload
          ls -lh ScooterBridge.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScooterBridge-ipa
          path: ScooterBridge.ipa

      - name: Publish to releases (nightly)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly build
          files: ScooterBridge.ipa
          prerelease: true
