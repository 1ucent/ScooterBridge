name: ScooterBridge
options:
  bundleIdPrefix: com.scooterbridge
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  ScooterBridge:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scooterbridge.app
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SUPPORTS_MACCATALYST: NO
    info:
      path: ScooterBridge/Info.plist
      properties:
        CFBundleDisplayName: ScooterBridge
        NSBluetoothAlwaysUsageDescription: "ScooterBridge uses Bluetooth to talk to BLE devices on your behalf."
        NSBluetoothPeripheralUsageDescription: "ScooterBridge uses Bluetooth to talk to BLE devices on your behalf."
        NSLocalNetworkUsageDescription: "ScooterBridge runs a small web server so your computer can use this phone's Bluetooth."
        NSBonjourServices:
          - _http._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
schemes:
  ScooterBridge:
    build:
      targets:
        ScooterBridge: all
    run:
      config: Debug
    archive:
      config: Release
